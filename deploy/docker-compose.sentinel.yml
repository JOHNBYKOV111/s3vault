# deploy/docker-compose.sentinel.yml
#
# Отдельный стенд для chaos-теста Sentinel failover.
# Поднимается независимо от основного docker-compose.yml:
#   docker compose -f deploy/docker-compose.sentinel.yml up -d
#
# ВАЖНО: используется network_mode: "host", потому что bridge-сеть ломает
# Sentinel failover (NAT не даёт клиенту подключиться к новому мастеру
# после повышения реплики). Host-сеть работает только на Linux (CI Ubuntu,
# Linux-хост). На Docker Desktop (Windows/macOS) host-сеть ограничена —
# локально тест может не пройти, но гоняется в CI.
#
# Порты (все на 127.0.0.1, host-сеть):
#   redis-master          — 6381 (6379 занят marketplace-redis локально)
#   redis-replica         — 6382 (другой порт, иначе конфликт в host-сети)
#   sentinel              — 26379
#   redis-sentinel-check  — тестовый клиент через Sentinel (одноразовый)

services:
  redis-master:
    image: redis:7-alpine
    network_mode: "host"
    command: ["redis-server", "--port", "6381", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica:
    image: redis:7-alpine
    network_mode: "host"
    command: ["redis-server", "--port", "6382", "--replicaof", "127.0.0.1", "6381", "--appendonly", "no"]
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6382", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  sentinel:
    image: redis:7-alpine
    network_mode: "host"
    command: ["redis-sentinel", "/etc/sentinel/sentinel.conf"]
    restart: unless-stopped
    volumes:
      # ВАЖНО: без :ro. Sentinel переписывает конфиг при старте
      # (добавляет myid, known-replica, epoch). С :ro падает
      # с "Read-only file system. Exiting...".
      - ./sentinel/sentinel.conf:/etc/sentinel/sentinel.conf
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-sentinel-check:
    build:
      # Контекст сборки — корень проекта (нужны go.mod, go.sum).
      context: ..
      dockerfile: cmd/redis-sentinel-check/Dockerfile
    image: deploy-redis-sentinel-check:latest
    network_mode: "host"
    # Одноразовый клиент: не перезапускается, живёт пока не остановят.
    restart: "no"
    depends_on:
      sentinel:
        condition: service_healthy
    # Клиент ходит в 127.0.0.1:26379 (host-сеть).
    # Entrypoint — /app/redis-sentinel-check, флаги — в command.
    command:
      - "-sentinel"
      - "127.0.0.1:26379"
      - "-master"
      - "mymaster"
      - "-interval"
      - "1s"