# deploy/sentinel/sentinel.conf
#
# Конфигурация Redis Sentinel для chaos-теста sentinel-failover.sh.
# Монтируется в контейнер sentinel по пути /etc/sentinel/sentinel.conf.
#
# Sentinel работает внутри Docker-сети compose, видит сервисы по именам:
#   redis-master:6379
#   redis-replica:6379
#
# ВАЖНО: sentinel resolve-hostnames должен идти ДО sentinel monitor.
# Sentinel читает конфиг последовательно: `sentinel monitor` с hostname'ом
# падает, если resolve-hostnames ещё не прочитан.

port 26379

bind 0.0.0.0

protected-mode no

logfile ""
loglevel notice

dir /tmp

# ============================================================
# Резолв hostname'ов (ОБЯЗАТЕЛЬНО до sentinel monitor)
# ============================================================
# Redis Sentinel по умолчанию не резолвит hostname'ы. Без этой директивы
# `sentinel monitor mymaster redis-master 6379 1` падает с
# FATAL CONFIG FILE ERROR: "Can't resolve instance hostname".
#
# announce-hostnames НЕ включаем: с ним Sentinel возвращает клиентам
# hostname ("redis-master"), а после kill master DNS-запись мёртвого
# контейнера исчезает, и клиент не может переподключиться
# (lookup redis-master: i/o timeout). Без announce-hostnames Sentinel
# возвращает IP, который не зависит от DNS.
sentinel resolve-hostnames yes

# ============================================================
# Мониторинг master'а
# ============================================================
# sentinel monitor <master-name> <ip> <port> <quorum>
#
# mymaster         — имя master'а (используется в sentinel-failover.sh
#                    и в тестовом клиенте: MasterName: "mymaster")
# redis-master     — имя сервиса в Docker-сети (DNS резолвится)
# 6379             — порт Redis внутри контейнера
# 1                — кворум: у нас один Sentinel, поэтому 1.
#                    В проде — минимум 3 Sentinel'а и кворум 2.
sentinel monitor mymaster redis-master 6379 1

# ============================================================
# Тайминги
# ============================================================
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1