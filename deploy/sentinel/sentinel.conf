# deploy/sentinel/sentinel.conf
#
# Конфигурация Redis Sentinel для chaos-теста sentinel-failover.sh.
# Монтируется в контейнер sentinel по пути /etc/sentinel/sentinel.conf.
#
# ВАЖНО: используется network_mode: "host" (см. docker-compose.sentinel.yml).
# Sentinel видит master и replica по 127.0.0.1 (host-сеть), а не по
# Docker-именам сервисов. Поэтому:
#   - master:  127.0.0.1:6381 (6379 занят marketplace-redis локально)
#   - replica: 127.0.0.1:6382 (другой порт, иначе конфликт в host-сети)
#
# resolve-hostnames НЕ нужен: мы используем только IP (127.0.0.1),
# hostname'ов в конфиге нет.

port 26379

bind 0.0.0.0

protected-mode no

logfile ""
loglevel notice

dir /tmp

# ============================================================
# Мониторинг master'а
# ============================================================
# sentinel monitor <master-name> <ip> <port> <quorum>
#
# mymaster         — имя master'а (используется в sentinel-failover.sh
#                    и в тестовом клиенте: MasterName: "mymaster")
# 127.0.0.1        — master в host-сети (network_mode: host)
# 6381             — порт master'а
# 1                — кворум: у нас один Sentinel, поэтому 1.
#                    В проде — минимум 3 Sentinel'а и кворум 2.
sentinel monitor mymaster 127.0.0.1 6381 1

# ============================================================
# Тайминги
# ============================================================
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1