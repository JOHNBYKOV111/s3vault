# deploy/sentinel/sentinel.conf
#
# Конфигурация Redis Sentinel для chaos-теста sentinel-failover.sh.
# Монтируется в контейнер sentinel по пути /etc/sentinel/sentinel.conf.
#
# ВАЖНО: используется bridge-сеть со СТАТИЧЕСКИМИ IP (см. docker-compose.sentinel.yml).
# Sentinel видит master по IP (172.28.0.10), а не по hostname.
# После `docker kill redis-master` контейнер получает тот же IP,
# поэтому "Failed to resolve hostname" не возникает.
#
# resolve-hostnames НЕ нужен: мы используем только IP (172.28.0.10),
# hostname'ов в конфиге нет.

port 26379

bind 0.0.0.0

protected-mode no

logfile ""
loglevel notice

dir /tmp

# ============================================================
# Мониторинг master'а
# ============================================================
# sentinel monitor <master-name> <ip> <port> <quorum>
#
# mymaster         — имя master'а (используется в sentinel-failover.sh
#                    и в тестовом клиенте: MasterName: "mymaster")
# 172.28.0.10      — статический IP master'а (bridge-сеть redisnet)
# 6379             — порт master'а
# 1                — кворум: у нас один Sentinel, поэтому 1.
#                    В проде — минимум 3 Sentinel'а и кворум 2.
sentinel monitor mymaster 172.28.0.10 6379 1

# ============================================================
# Тайминги
# ============================================================
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1