name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: go mod download

    - name: Start Postgres
      run: |
        docker run -d --name ci-postgres \
          -p 5433:5432 \
          -e POSTGRES_USER=s3vault \
          -e POSTGRES_PASSWORD=s3vault \
          -e POSTGRES_DB=s3vault \
          postgres:16-alpine
        # Ждём готовности Postgres (до 30 секунд).
        for i in $(seq 1 30); do
          if docker exec ci-postgres pg_isready -U s3vault -d s3vault >/dev/null 2>&1; then
            echo "postgres is ready"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "postgres did not become ready in 30s" >&2
            docker logs ci-postgres >&2
            exit 1
          fi
          sleep 1
        done

    - name: Apply migrations
      run: |
        # Применяем миграции из internal/metadata/migrations/*.up.sql
        # в порядке возрастания (000001, 000002, ...).
        for f in $(ls internal/metadata/migrations/*.up.sql | sort); do
          echo "applying $f"
          PGPASSWORD=s3vault psql \
            -h localhost -p 5433 -U s3vault -d s3vault \
            -v ON_ERROR_STOP=1 \
            -f "$f"
        done
      env:
        PGPASSWORD: s3vault

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Vet
      run: go vet ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: latest

    - name: Stop Postgres
      if: always()
      run: docker rm -f ci-postgres || true

  sentinel-failover:
    name: Sentinel failover (chaos)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: go mod download

    - name: Ensure script is executable
      run: chmod +x scripts/chaos/sentinel-failover.sh

    - name: Run Sentinel failover chaos test
      run: ./scripts/chaos/sentinel-failover.sh