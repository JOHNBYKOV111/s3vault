name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: go mod download

    - name: Start Postgres
      run: |
        docker run -d --name ci-postgres \
          -p 5433:5432 \
          -e POSTGRES_USER=s3vault \
          -e POSTGRES_PASSWORD=s3vault \
          -e POSTGRES_DB=s3vault \
          postgres:16-alpine
        # pg_isready возвращает "ready" слишком рано. Ждём SELECT 1.
        for i in $(seq 1 30); do
          if docker exec ci-postgres psql -U s3vault -d s3vault -c 'SELECT 1' >/dev/null 2>&1; then
            echo "postgres is ready (SELECT 1 ok)"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "postgres did not become ready in 30s" >&2
            docker logs ci-postgres >&2
            exit 1
          fi
          sleep 1
        done

    - name: Apply migrations
      run: |
        for f in $(ls internal/metadata/migrations/*.up.sql | sort); do
          echo "applying $f"
          PGPASSWORD=s3vault psql \
            -h localhost -p 5433 -U s3vault -d s3vault \
            -v ON_ERROR_STOP=1 \
            -f "$f"
        done
      env:
        PGPASSWORD: s3vault

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Vet
      run: go vet ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v7
      with:
        version: v2.14.0

    - name: Stop Postgres
      if: always()
      run: docker rm -f ci-postgres || true

  sentinel-failover:
    name: Sentinel failover (chaos)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: go mod download

    - name: Ensure Docker Compose v2
      run: |
        if ! docker compose version >/dev/null 2>&1; then
          echo "docker compose v2 not found, installing docker-compose-plugin"
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin
        fi
        docker compose version

    - name: Ensure script is executable
      run: chmod +x scripts/chaos/sentinel-failover.sh

    - name: Run Sentinel failover chaos test
      run: ./scripts/chaos/sentinel-failover.sh

  e2e:
    name: E2E (s3vault + AWS SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: go mod download

    - name: Start Postgres
      run: |
        docker run -d --name ci-postgres-e2e \
          -p 5433:5432 \
          -e POSTGRES_USER=s3vault \
          -e POSTGRES_PASSWORD=s3vault \
          -e POSTGRES_DB=s3vault \
          postgres:16-alpine
        # pg_isready возвращает "ready" слишком рано. Ждём SELECT 1.
        for i in $(seq 1 30); do
          if docker exec ci-postgres-e2e psql -U s3vault -d s3vault -c 'SELECT 1' >/dev/null 2>&1; then
            echo "postgres is ready (SELECT 1 ok)"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "postgres did not become ready in 30s" >&2
            docker logs ci-postgres-e2e >&2
            exit 1
          fi
          sleep 1
        done

    - name: Apply migrations
      run: |
        for f in $(ls internal/metadata/migrations/*.up.sql | sort); do
          echo "applying $f"
          PGPASSWORD=s3vault psql \
            -h localhost -p 5433 -U s3vault -d s3vault \
            -v ON_ERROR_STOP=1 \
            -f "$f"
        done
      env:
        PGPASSWORD: s3vault

    - name: Start s3vault
      run: |
        DATABASE_URL="postgres://s3vault:s3vault@localhost:5433/s3vault?sslmode=disable" \
          go run ./cmd/server >s3vault.log 2>&1 &
        echo $! > s3vault.pid
        for i in $(seq 1 30); do
          if curl -sf http://localhost:9000/healthz >/dev/null 2>&1; then
            echo "s3vault is up"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "s3vault did not become ready in 30s" >&2
            cat s3vault.log >&2
            exit 1
          fi
          sleep 1
        done

    - name: Run E2E tests
      run: go test -v -race -tags=e2e ./internal/s3api/ -run TestS3Conformance

    - name: Stop s3vault
      if: always()
      run: |
        if [ -f s3vault.pid ]; then
          kill "$(cat s3vault.pid)" 2>/dev/null || true
        fi
        pkill -f "cmd/server" 2>/dev/null || true

    - name: Stop Postgres
      if: always()
      run: docker rm -f ci-postgres-e2e || true